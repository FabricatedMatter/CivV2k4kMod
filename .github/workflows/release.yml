# Builds the mod DLL and the Windows / Linux setup programs. On a tag (v*) the results are
# attached to a GitHub release. The art packs are built by the maintainer from game files
# (tools/pack.py build) and uploaded to the same release separately.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686
      - run: make -C native
      - uses: actions/upload-artifact@v4
        with:
          name: version-dll
          path: native/build/version.dll

  setup:
    needs: dll
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: CivVUIScale-Setup
            extra: --windowed --icon build/icon.ico --version-file installer/exe_version.txt
          - os: ubuntu-22.04   # older glibc: runs on more distros
            name: civ5-uiscale-setup
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: version-dll
          path: dll
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller numpy pillow
      # the DLL goes in compressed: a raw DLL unpacked to %TEMP% by the exe gets blocked by
      # Windows Security as a dropped payload
      - name: Payload and icon
        shell: bash
        run: |
          mkdir -p payload build
          python -c "import sys; sys.path.insert(0, 'installer'); import setup_core as c; c.make_payload('dll/version.dll', 'payload/version.bin')"
          python installer/setup_app.py --write-icon build/icon.ico
      - name: Build setup program
        shell: bash
        run: >
          pyinstaller --onefile ${{ matrix.extra }} --name ${{ matrix.name }}
          --paths tools --paths installer
          --add-data "payload/version.bin:payload"
          --add-data "mod:payload/mod"
          --add-data "tools:tools"
          --hidden-import numpy --hidden-import PIL.Image --hidden-import PIL.ImageFont
          --hidden-import PIL.ImageDraw --hidden-import PIL.ImageFilter --hidden-import PIL.ImageTk
          --hidden-import setup_gui --hidden-import skin --hidden-import bcn
          --hidden-import uisprite --hidden-import pack --hidden-import locate
          installer/setup_app.py
      - name: Package
        shell: bash
        run: |
          mkdir out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/${{ matrix.name }}.exe out/
          else
            cp dist/${{ matrix.name }} installer/install.sh out/
            tar -czf ${{ matrix.name }}-linux.tar.gz -C out .
            rm -rf out/* && mv ${{ matrix.name }}-linux.tar.gz out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CivVUIScale-Setup/*
            artifacts/civ5-uiscale-setup/*
            artifacts/version-dll/version.dll
